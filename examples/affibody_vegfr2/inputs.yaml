# RFdiffusion3 input specification for affibody-VEGFR2 interface redesign
#
# GOAL: Improve binding affinity of a 58-aa affibody against VEGFR2 by
#       partially diffusing the affibody chain while keeping VEGFR2 fixed,
#       then allowing RFD3 to redesign side chains at the binding interface.
#
# SETUP INSTRUCTIONS:
#   1. Set `input` to the path of your starting affibody-VEGFR2 complex PDB.
#      Expected chain assignment:
#        Chain A — affibody (58 residues, A1–A58)
#        Chain B — VEGFR2 target domain
#   2. Adjust `select_unfixed_sequence` to list the interface residues on the
#      affibody you want to redesign (see notes below).
#   3. Adjust `select_hotspots` to point at key VEGFR2 contact atoms.
#   4. Tune `partial_t` to control how much backbone exploration to allow
#      (recommended starting range: 5.0–15.0 Å; lower = more conservative).
#
# RUN (from the foundry repo root):
#   rfd3 design \
#     out_dir=examples/affibody_vegfr2/outputs \
#     inputs=examples/affibody_vegfr2/inputs.yaml \
#     n_batches=5 \
#     diffusion_batch_size=16

# ── Conservative run: small noise, redesign only interface side chains ────────
affibody_vegfr2_conservative:
  input: /path/to/your/affibody_vegfr2_complex.pdb   # <-- UPDATE THIS

  # Keep both chains; chain break (/0) between affibody and VEGFR2.
  # Adjust B residue range to match your VEGFR2 domain length.
  contig: "A1-58,/0,B1-200"

  # ── What to fix in 3-D space ──────────────────────────────────────────────
  # Fix VEGFR2 all-atom coordinates completely; fix affibody backbone only.
  # (affibody side chains at interface positions will be diffused via partial_t)
  select_fixed_atoms:
    B1-200: ALL       # Fix all VEGFR2 atoms — adjust range to match your structure
    A1-58: BKBN       # Fix affibody backbone (N, CA, C, O) — sidechains float

  # ── Where sequence redesign is allowed ───────────────────────────────────
  # List the affibody residues at the binding interface.
  # These are the positions that make contacts with VEGFR2 and will have their
  # amino-acid identity optimised by the model.
  #
  # For a typical three-helix-bundle affibody the interface spans helix-1 and
  # helix-2.  Common contact positions (renumber to match your structure):
  #   Helix-1 face:  A9,  A10, A11, A13, A14, A17, A18
  #   Helix-2 face:  A24, A25, A27, A28, A32, A35
  #
  # Replace the residue numbers below with the actual interface positions
  # identified from your starting complex (e.g. by PyMOL contact analysis
  # or a distance cutoff of 4–5 Å to VEGFR2 heavy atoms).
  select_unfixed_sequence: "A9,A10,A11,A13,A14,A17,A18,A24,A25,A27,A28,A32,A35"

  # ── VEGFR2 hotspot atoms to guide binder placement ───────────────────────
  # Atoms on VEGFR2 that the designed affibody should come within ~4.5 Å of.
  # Update residue numbers to match the hotspot residues in your VEGFR2 chain.
  # Typical VEGFR2 D2 domain hotspots (renumber as needed):
  select_hotspots:
    B13: "CG1,CG2"
    B15: "CG,CZ"
    B43: "CG,CZ"
    B75: "CG,SD"
    B89: "CD1,CG2"
    B91: "CG1,CG2"
    B187: "CG,CD1"

  # ── Partial diffusion settings ────────────────────────────────────────────
  # 5.0 Å is conservative — mostly side-chain remodelling with slight backbone
  # relaxation.  Increase to 10–15 Å for more backbone diversity.
  partial_t: 5.0

  # Place origin token near hotspot centre of mass for better sampling
  infer_ori_strategy: hotspots

  # Enable pLDDT-guided enhancement for better designability
  plddt_enhanced: true

  # Redesign motif sidechains (affibody is the "motif" here)
  redesign_motif_sidechains: true


# ── Moderate run: more backbone freedom, useful for larger conformational change
affibody_vegfr2_moderate:
  input: /path/to/your/affibody_vegfr2_complex.pdb   # <-- UPDATE THIS

  contig: "A1-58,/0,B1-200"

  select_fixed_atoms:
    B1-200: ALL
    A1-58: BKBN

  select_unfixed_sequence: "A9,A10,A11,A13,A14,A17,A18,A24,A25,A27,A28,A32,A35"

  select_hotspots:
    B13: "CG1,CG2"
    B15: "CG,CZ"
    B43: "CG,CZ"
    B75: "CG,SD"
    B89: "CD1,CG2"
    B91: "CG1,CG2"
    B187: "CG,CD1"

  # Higher noise = more backbone exploration around the interface
  partial_t: 10.0

  infer_ori_strategy: hotspots
  plddt_enhanced: true
  redesign_motif_sidechains: true


# ── Aggressive run: allow affibody length variation and full backbone redesign
# Useful if the affibody backbone needs to repack significantly.
# Note: removes the fixed-backbone constraint on the affibody.
affibody_vegfr2_aggressive:
  input: /path/to/your/affibody_vegfr2_complex.pdb   # <-- UPDATE THIS

  # Designed region replaces affibody with new backbone of the same length.
  # /0 chain break separates it from the fixed VEGFR2.
  contig: "55-62,/0,B1-200"

  # Only fix VEGFR2; affibody backbone is fully diffused
  select_fixed_atoms:
    B1-200: ALL

  select_hotspots:
    B13: "CG1,CG2"
    B15: "CG,CZ"
    B43: "CG,CZ"
    B75: "CG,SD"
    B89: "CD1,CG2"
    B91: "CG1,CG2"
    B187: "CG,CD1"

  # Total length stays near original 58 + 200 = 258 residues
  length: "255-262"

  infer_ori_strategy: hotspots
  plddt_enhanced: true
  redesign_motif_sidechains: false
